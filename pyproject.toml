[project]
name = "credit-card-analyzer"
version = "0.1.0"
description = "Automated credit card statement sync and financial tracking with FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "sqlalchemy>=2.0.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.10.0",
    "gspread>=6.0.0",
    "google-auth>=2.27.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.115.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "psycopg2-binary>=2.9.9",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
where = ["."]
include = ["parsers*", "routers*"]
exclude = ["templates*", "statements*", "static*", ".venv*"]

[tool.fastapi]
entrypoint = "main:app"
